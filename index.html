<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Risk - Graphical Map Edition</title>
    <style>
        body {
            background-color: #0b0b0e;
            color: #e0e0e0;
            font-family: monospace;
            padding: 15px;
            margin: 0;
            line-height: 1.4;
        }
        h1, h2, h3 {
            color: #ffffff;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }
        button {
            background-color: #1a1a24;
            color: #ffffff;
            border: 2px solid #555;
            padding: 10px 15px;
            font-family: monospace;
            font-size: 16px;
            cursor: pointer;
            margin: 5px 0;
            display: inline-block;
        }
        button:hover {
            background-color: #ffffff;
            color: #000000;
        }
        select, input {
            background-color: #1a1a24;
            color: #ffffff;
            border: 1px solid #555;
            padding: 8px;
            font-family: monospace;
            font-size: 16px;
            margin: 5px 0;
        }
        .card {
            background-color: #121218;
            border: 1px solid #333;
            padding: 15px;
            margin-bottom: 15px;
        }
        .continent-box {
            border-left: 3px solid #ffffff;
            padding-left: 10px;
            margin: 10px 0;
            background: #161622;
            padding: 10px;
            border: 1px solid #444;
        }
        .territory-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed #333333;
        }
        .log-box {
            background-color: #08080a;
            border: 1px solid #333;
            padding: 10px;
            height: 130px;
            overflow-y: scroll;
            font-size: 13px;
        }
        .hidden { display: none; }
        
        /* SVG Map Styling */
        #risk-svg-map {
            width: 100%;
            height: 560px;
            background: #0f0f17;
            border: 2px solid #ffffff;
        }
        .territory-node {
            cursor: pointer;
            transition: filter 0.2s;
        }
        .territory-node:hover {
            filter: brightness(1.3);
        }
    </style>
</head>
<body>

    <h1>TEXT RISK: VISUAL EDITION</h1>

    <!-- SETUP SCREEN -->
    <div id="setup-screen" class="card">
        <h2>Game Setup</h2>
        <label>Number of Players (2-6):</label><br>
        <select id="player-count">
            <option value="2">2 Players</option>
            <option value="3">3 Players</option>
            <option value="4">4 Players</option>
            <option value="5">5 Players</option>
            <option value="6">6 Players</option>
        </select><br><br>
        <div id="player-names-inputs">
            <label>Player 1 Initial (e.g., S):</label> <input type="text" id="p0" value="S" maxlength="2"><br>
            <label>Player 2 Initial (e.g., F):</label> <input type="text" id="p1" value="F" maxlength="2"><br>
        </div>
        <br>
        <button onclick="startGame()">Start Game</button>
    </div>

    <!-- GAMEPLAY SCREEN -->
    <div id="game-screen" class="hidden">
        <div class="card">
            <h2 id="turn-info">Turn Info</h2>
            <p id="phase-info">Phase: Reinforce</p>
            <div id="action-area"></div>
        </div>

        <div class="card">
            <h2>Interactive World Board</h2>
            <p style="font-size: 12px; color: #aaa;">Double borders outline continents. High-contrast labels show Territory Name, Owner, and Armies.</p>
            <svg id="risk-svg-map" viewBox="0 0 1000 560">
                <defs>
                    <!-- Double border pattern/stroke trick using multiple groups -->
                </defs>
                <g id="map-continent-borders"></g>
                <g id="map-connections"></g>
                <g id="map-nodes"></g>
            </svg>
        </div>

        <div class="card">
            <h2>Quick Reference Text List</h2>
            <div id="map-display"></div>
        </div>

        <div class="card">
            <h2>Battle Log</h2>
            <div id="game-log" class="log-box"></div>
        </div>
    </div>

<script>
const continentsData = {
    "North America": { bonus: 5, color: "#1f3a5f", border: "#4a90e2", box: {x: 40, y: 30, w: 290, h: 260}, territories: ["Alaska", "Northwest Territory", "Greenland", "Alberta", "Ontario", "Quebec", "Western US", "Eastern US", "Central America"] },
    "South America": { bonus: 2, color: "#1b4d3e", border: "#27ae60", box: {x: 140, y: 310, w: 160, h: 210}, territories: ["Venezuela", "Peru", "Brazil", "Argentina"] },
    "Europe": { bonus: 5, color: "#243b55", border: "#3498db", box: {x: 390, y: 40, w: 260, h: 230}, territories: ["Iceland", "Great Britain", "Western Europe", "Northern Europe", "Southern Europe", "Scandinavia", "Ukraine"] },
    "Africa": { bonus: 3, color: "#5c3a21", border: "#e67e22", box: {x: 450, y: 280, w: 250, h: 250}, territories: ["North Africa", "Egypt", "East Africa", "Congo", "South Africa", "Madagascar"] },
    "Asia": { bonus: 7, color: "#4a235a", border: "#9b59b6", box: {x: 610, y: 30, w: 360, h: 300}, territories: ["Ural", "Siberia", "Yakutsk", "Kamchatka", "Afghanistan", "China", "India", "Middle East", "Japan", "Mongolia", "Irkutsk", "Siam"] },
    "Australia": { bonus: 2, color: "#641e16", border: "#e74c3c", box: {x: 790, y: 345, w: 180, h: 165}, territories: ["Indonesia", "New Guinea", "Western Australia", "Eastern Australia"] }
};

const territoryCoords = {
    "Alaska": {x: 80, y: 70, continent: "North America"},
    "Northwest Territory": {x: 170, y: 70, continent: "North America"},
    "Greenland": {x: 280, y: 70, continent: "North America"},
    "Alberta": {x: 120, y: 130, continent: "North America"},
    "Ontario": {x: 200, y: 130, continent: "North America"},
    "Quebec": {x: 270, y: 130, continent: "North America"},
    "Western US": {x: 120, y: 190, continent: "North America"},
    "Eastern US": {x: 210, y: 190, continent: "North America"},
    "Central America": {x: 160, y: 250, continent: "North America"},
    
    "Venezuela": {x: 180, y: 350, continent: "South America"},
    "Peru": {x: 170, y: 430, continent: "South America"},
    "Brazil": {x: 240, y: 400, continent: "South America"},
    "Argentina": {x: 200, y: 480, continent: "South America"},

    "Iceland": {x: 420, y: 90, continent: "Europe"},
    "Great Britain": {x: 430, y: 160, continent: "Europe"},
    "Scandinavia": {x: 520, y: 90, continent: "Europe"},
    "Western Europe": {x: 430, y: 220, continent: "Europe"},
    "Northern Europe": {x: 510, y: 170, continent: "Europe"},
    "Southern Europe": {x: 520, y: 220, continent: "Europe"},
    "Ukraine": {x: 600, y: 140, continent: "Europe"},

    "North Africa": {x: 490, y: 320, continent: "Africa"},
    "Egypt": {x: 580, y: 310, continent: "Africa"},
    "East Africa": {x: 610, y: 380, continent: "Africa"},
    "Congo": {x: 550, y: 430, continent: "Africa"},
    "South Africa": {x: 570, y: 490, continent: "Africa"},
    "Madagascar": {x: 660, y: 460, continent: "Africa"},

    "Ural": {x: 680, y: 100, continent: "Asia"},
    "Siberia": {x: 770, y: 80, continent: "Asia"},
    "Yakutsk": {x: 860, y: 60, continent: "Asia"},
    "Kamchatka": {x: 940, y: 70, continent: "Asia"},
    "Afghanistan": {x: 680, y: 180, continent: "Asia"},
    "China": {x: 790, y: 200, continent: "Asia"},
    "India": {x: 720, y: 260, continent: "Asia"},
    "Middle East": {x: 630, y: 240, continent: "Asia"},
    "Japan": {x: 920, y: 170, continent: "Asia"},
    "Mongolia": {x: 840, y: 150, continent: "Asia"},
    "Irkutsk": {x: 840, y: 105, continent: "Asia"},
    "Siam": {x: 820, y: 260, continent: "Asia"},

    "Indonesia": {x: 820, y: 385, continent: "Australia"},
    "New Guinea": {x: 930, y: 385, continent: "Australia"},
    "Western Australia": {x: 850, y: 470, continent: "Australia"},
    "Eastern Australia": {x: 930, y: 470, continent: "Australia"}
};

const connections = {
    "Alaska": ["Northwest Territory", "Alberta", "Kamchatka"],
    "Northwest Territory": ["Alaska", "Alberta", "Ontario", "Greenland"],
    "Greenland": ["Northwest Territory", "Ontario", "Quebec", "Iceland"],
    "Alberta": ["Alaska", "Northwest Territory", "Ontario", "Western US"],
    "Ontario": ["Northwest Territory", "Alberta", "Quebec", "Western US", "Eastern US", "Greenland"],
    "Quebec": ["Ontario", "Eastern US", "Greenland"],
    "Western US": ["Alberta", "Ontario", "Eastern US", "Central America"],
    "Eastern US": ["Quebec", "Ontario", "Western US", "Central America"],
    "Central America": ["Western US", "Eastern US", "Venezuela"],
    "Venezuela": ["Central America", "Peru", "Brazil"],
    "Peru": ["Venezuela", "Brazil", "Argentina"],
    "Brazil": ["Venezuela", "Peru", "North Africa", "Argentina"],
    "Argentina": ["Peru", "Brazil"],
    "Iceland": ["Greenland", "Great Britain", "Scandinavia"],
    "Great Britain": ["Iceland", "Scandinavia", "Northern Europe", "Western Europe"],
    "Western Europe": ["Great Britain", "Northern Europe", "Southern Europe", "North Africa"],
    "Northern Europe": ["Great Britain", "Iceland", "Western Europe", "Southern Europe", "Ukraine"],
    "Southern Europe": ["Western Europe", "Northern Europe", "Ukraine", "North Africa", "Egypt"],
    "Scandinavia": ["Iceland", "Great Britain", "Northern Europe", "Ukraine"],
    "Ukraine": ["Scandinavia", "Northern Europe", "Southern Europe", "Ural", "Afghanistan", "Middle East"],
    "North Africa": ["Western Europe", "Southern Europe", "Egypt", "East Africa", "Congo", "Brazil"],
    "Egypt": ["North Africa", "Southern Europe", "East Africa", "Middle East"],
    "East Africa": ["Egypt", "North Africa", "Congo", "South Africa", "Madagascar", "Middle East"],
    "Congo": ["North Africa", "East Africa", "South Africa"],
    "South Africa": ["Congo", "East Africa", "Madagascar"],
    "Madagascar": ["East Africa", "South Africa"],
    "Ural": ["Ukraine", "Siberia", "Afghanistan", "China"],
    "Siberia": ["Ural", "Yakutsk", "Irkutsk", "Mongolia", "China"],
    "Yakutsk": ["Siberia", "Irkutsk", "Kamchatka"],
    "Kamchatka": ["Yakutsk", "Irkutsk", "Japan", "Alaska"],
    "Afghanistan": ["Ukraine", "Ural", "China", "India", "Middle East"],
    "China": ["Ural", "Siberia", "Mongolia", "Siam", "India", "Afghanistan"],
    "India": ["Afghanistan", "China", "Siam", "Middle East"],
    "Middle East": ["Ukraine", "Southern Europe", "Egypt", "East Africa", "Afghanistan", "India"],
    "Japan": ["Kamchatka", "Mongolia"],
    "Mongolia": ["Siberia", "Irkutsk", "Japan", "China", "Kamchatka"],
    "Irkutsk": ["Siberia", "Yakutsk", "Kamchatka", "Mongolia"],
    "Siam": ["China", "India", "Indonesia"],
    "Indonesia": ["Siam", "New Guinea", "Western Australia"],
    "New Guinea": ["Indonesia", "Eastern Australia"],
    "Western Australia": ["Indonesia", "Eastern Australia"],
    "Eastern Australia": ["Western Australia", "New Guinea"]
};

let gameState = {
    players: [],
    currentTurn: 0,
    phase: 'reinforce',
    territories: {},
    reinforcementsLeft: 0
};

document.getElementById('player-count').addEventListener('change', function() {
    let count = parseInt(this.value);
    let html = '';
    let defaultInitials = ['S', 'F', 'J', 'B', 'M', 'K'];
    for(let i = 0; i < count; i++) {
        html += `<label>Player ${i+1} Initial:</label> <input type="text" id="p${i}" value="${defaultInitials[i]}" maxlength="2"><br>`;
    }
    document.getElementById('player-names-inputs').innerHTML = html;
});

function startGame() {
    let count = parseInt(document.getElementById('player-count').value);
    gameState.players = [];
    for(let i = 0; i < count; i++) {
        let val = document.getElementById(`p${i}`).value.trim() || `P${i+1}`;
        gameState.players.push(val);
    }

    let allTerritories = [];
    for(let cont in continentsData) {
        allTerritories.push(...continentsData[cont].territories);
    }
    
    allTerritories.sort(() => Math.random() - 0.5);
    let startingArmies = { 2: 40, 3: 35, 4: 30, 5: 25, 6: 20 }[count];

    allTerritories.forEach((t, index) => {
        let owner = gameState.players[index % gameState.players.length];
        gameState.territories[t] = { owner: owner, armies: 1 };
    });

    let assignedCount = allTerritories.length;
    let totalPool = startingArmies * count;
    let remainingPool = totalPool - assignedCount;

    let pIndex = 0;
    while(remainingPool > 0) {
        let terrsOwned = Object.keys(gameState.territories).filter(t => gameState.territories[t].owner === gameState.players[pIndex]);
        if(terrsOwned.length > 0) {
            let randomTerr = terrsOwned[Math.floor(Math.random() * terrsOwned.length)];
            gameState.territories[randomTerr].armies++;
            remainingPool--;
        }
        pIndex = (pIndex + 1) % count;
    }

    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('game-screen').classList.remove('hidden');

    startTurn();
}

function logMessage(msg) {
    let box = document.getElementById('game-log');
    box.innerHTML += `<div>> ${msg}</div>`;
    box.scrollTop = box.scrollHeight;
}

function startTurn() {
    let currentPlayer = gameState.players[gameState.currentTurn];
    gameState.phase = 'reinforce';

    let ownedTerrs = Object.keys(gameState.territories).filter(t => gameState.territories[t].owner === currentPlayer);
    let countBonus = Math.max(3, Math.floor(ownedTerrs.length / 3));

    let continentBonus = 0;
    for(let cont in continentsData) {
        let fullCont = continentsData[cont].territories.every(t => gameState.territories[t].owner === currentPlayer);
        if(fullCont) {
            continentBonus += continentsData[cont].bonus;
        }
    }

    gameState.reinforcementsLeft = countBonus + continentBonus;
    logMessage(`--- Turn Started: Player [${currentPlayer}] ---`);
    logMessage(`Earned ${countBonus} (territories) + ${continentBonus} (continents) = ${gameState.reinforcementsLeft} new armies.`);

    updateUI();
}

function updateUI() {
    let currentPlayer = gameState.players[gameState.currentTurn];
    document.getElementById('turn-info').innerText = `Current Player: [${currentPlayer}]`;
    document.getElementById('phase-info').innerText = `Phase: ${gameState.phase.toUpperCase()}`;

    let actionArea = document.getElementById('action-area');
    actionArea.innerHTML = '';

    if(gameState.phase === 'reinforce') {
        actionArea.innerHTML = `
            <p>Armies to place: <strong>${gameState.reinforcementsLeft}</strong></p>
            <label>Target Territory:</label><br>
            <select id="ref-terr">
                ${Object.keys(gameState.territories).filter(t => gameState.territories[t].owner === currentPlayer).map(t => `<option value="${t}">${t} (${gameState.territories[t].armies} armies)</option>`).join('')}
            </select><br>
            <label>Amount:</label><br>
            <input type="number" id="ref-amt" value="1" min="1" max="${gameState.reinforcementsLeft}"><br><br>
            <button onclick="executeReinforce()">Deploy Armies</button>
        `;
    } else if(gameState.phase === 'attack') {
        let myTerrs = Object.keys(gameState.territories).filter(t => gameState.territories[t].owner === currentPlayer && gameState.territories[t].armies > 1);
        
        actionArea.innerHTML = `
            <p>Select attacking territory (> 1 army) and adjacent target.</p>
            <label>Attack From:</label><br>
            <select id="atk-from" onchange="updateAttackTargets()">
                ${myTerrs.map(t => `<option value="${t}">${t} (${gameState.territories[t].armies} armies)</option>`).join('')}
            </select><br>
            <label>Attack Target:</label><br>
            <select id="atk-to"></select><br><br>
            <button onclick="executeAttack()">Launch Attack</button>
            <button onclick="endAttackPhase()">Finish Attacks / Fortify</button>
        `;
        setTimeout(updateAttackTargets, 50);
    } else if(gameState.phase === 'fortify') {
        let myTerrs = Object.keys(gameState.territories).filter(t => gameState.territories[t].owner === currentPlayer && gameState.territories[t].armies > 1);
        
        actionArea.innerHTML = `
            <p>Move armies between connected territories you own.</p>
            <label>From:</label><br>
            <select id="fort-from">
                ${myTerrs.map(t => `<option value="${t}">${t} (${gameState.territories[t].armies})</option>`).join('')}
            </select><br>
            <label>To (Connected):</label><br>
            <select id="fort-to">
                ${Object.keys(gameState.territories).filter(t => gameState.territories[t].owner === currentPlayer).map(t => `<option value="${t}">${t}</option>`).join('')}
            </select><br>
            <label>Armies:</label><br>
            <input type="number" id="fort-amt" value="1" min="1"><br><br>
            <button onclick="executeFortify()">Move & End Turn</button>
            <button onclick="endTurn()">Skip / End Turn</button>
        `;
    }

    renderSvgMap();
    renderTextList();
}

function renderSvgMap() {
    let borderGroup = document.getElementById('map-continent-borders');
    let connGroup = document.getElementById('map-connections');
    let nodeGroup = document.getElementById('map-nodes');
    
    borderGroup.innerHTML = '';
    connGroup.innerHTML = '';
    nodeGroup.innerHTML = '';

    // 1. Render Continent Double Borders / Background Boxes
    for(let cont in continentsData) {
        let b = continentsData[cont].box;
        let color = continentsData[cont].border;

        // Outer container border
        let rectOuter = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rectOuter.setAttribute("x", b.x);
        rectOuter.setAttribute("y", b.y);
        rectOuter.setAttribute("width", b.w);
        rectOuter.setAttribute("height", b.h);
        rectOuter.setAttribute("rx", "8");
        rectOuter.setAttribute("fill", continentsData[cont].color);
        rectOuter.setAttribute("stroke", color);
        rectOuter.setAttribute("stroke-width", "3");
        borderGroup.appendChild(rectOuter);

        // Inner double-border layer for continent separation
        let rectInner = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rectInner.setAttribute("x", b.x + 5);
        rectInner.setAttribute("y", b.y + 5);
        rectInner.setAttribute("width", b.w - 10);
        rectInner.setAttribute("height", b.h - 10);
        rectInner.setAttribute("rx", "5");
        rectInner.setAttribute("fill", "none");
        rectInner.setAttribute("stroke", "#ffffff");
        rectInner.setAttribute("stroke-width", "1");
        rectInner.setAttribute("stroke-dasharray", "4,4");
        borderGroup.appendChild(rectInner);

        // Continent Name Label
        let label = document.createElementNS("http://www.w3.org/2000/svg", "text");
        label.setAttribute("x", b.x + 12);
        label.setAttribute("y", b.y + 20);
        label.setAttribute("fill", "#ffffff");
        label.setAttribute("font-size", "11px");
        label.setAttribute("font-weight", "bold");
        label.setAttribute("opacity", "0.8");
        label.textContent = `${cont.toUpperCase()} (+${continentsData[cont].bonus})`;
        borderGroup.appendChild(label);
    }

    // 2. Render Connections (with high-contrast white connection lines)
    let drawnLines = new Set();
    for(let t in connections) {
        let p1 = territoryCoords[t];
        if(!p1) continue;
        connections[t].forEach(n => {
            let p2 = territoryCoords[n];
            if(!p2) return;
            let lineKey = [t, n].sort().join('--');
            if(!drawnLines.has(lineKey)) {
                drawnLines.add(lineKey);
                
                // Outer glow/contrast line for ocean/inter-continent crossings
                let lineBg = document.createElementNS("http://www.w3.org/2000/svg", "line");
                lineBg.setAttribute("x1", p1.x);
                lineBg.setAttribute("y1", p1.y);
                lineBg.setAttribute("x2", p2.x);
                lineBg.setAttribute("y2", p2.y);
                lineBg.setAttribute("stroke", "#000000");
                lineBg.setAttribute("stroke-width", "4");
                connGroup.appendChild(lineBg);

                // Bright white connection line
                let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", p1.x);
                line.setAttribute("y1", p1.y);
                line.setAttribute("x2", p2.x);
                line.setAttribute("y2", p2.y);
                line.setAttribute("stroke", "#ffffff");
                line.setAttribute("stroke-width", "1.5");
                if(p1.continent !== p2.continent) {
                    line.setAttribute("stroke-dasharray", "3,3"); // Dashed line for ocean/inter-continental links
                }
                connGroup.appendChild(line);
            }
        });
    }

    // 3. Render Territory Nodes (with white borders, high-contrast labels, and names inside/near box)
    for(let t in territoryCoords) {
        let coord = territoryCoords[t];
        let data = gameState.territories[t];
        let isCurrentPlayer = data && data.owner === gameState.players[gameState.currentTurn];

        let g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("class", "territory-node");

        // Node background pill/circle with thick white border
        let rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", coord.x - 32);
        rect.setAttribute("y", coord.y - 15);
        rect.setAttribute("width", "64");
        rect.setAttribute("height", "30");
        rect.setAttribute("rx", "6");
        rect.setAttribute("fill", "#111118");
        rect.setAttribute("stroke", isCurrentPlayer ? "#ffcc00" : "#ffffff");
        rect.setAttribute("stroke-width", isCurrentPlayer ? "2.5" : "1.5");

        // Territory Name (High contrast white)
        let nameText = document.createElementNS("http://www.w3.org/2000/svg", "text");
        nameText.setAttribute("x", coord.x);
        nameText.setAttribute("y", coord.y - 4);
        nameText.setAttribute("text-anchor", "middle");
        nameText.setAttribute("fill", "#ffffff");
        nameText.setAttribute("font-size", "9px");
        nameText.setAttribute("font-weight", "bold");
        // Shorten long names for the node display if needed
        let displayName = t.length > 10 ? t.substring(0, 9) + "." : t;
        nameText.textContent = displayName;

        // Owner & Army Count
        let infoText = document.createElementNS("http://www.w3.org/2000/svg", "text");
        infoText.setAttribute("x", coord.x);
        infoText.setAttribute("y", coord.y + 9);
        infoText.setAttribute("text-anchor", "middle");
        infoText.setAttribute("fill", "#00ffcc");
        infoText.setAttribute("font-size", "10px");
        infoText.setAttribute("font-weight", "bold");
        infoText.textContent = data ? `[${data.owner}]: ${data.armies}` : '';

        let title = document.createElementNS("http://www.w3.org/2000/svg", "title");
        title.textContent = `${t} (${coord.continent}) - Owner: [${data ? data.owner : 'None'}], Armies: ${data ? data.armies : 0}`;

        g.appendChild(rect);
        g.appendChild(nameText);
        g.appendChild(infoText);
        g.appendChild(title);
        nodeGroup.appendChild(g);
    }
}

function renderTextList() {
    let mapHtml = '';
    for(let cont in continentsData) {
        mapHtml += `<div class="continent-box"><h3>${cont} (Bonus: +${continentsData[cont].bonus})</h3>`;
        continentsData[cont].territories.forEach(t => {
            let data = gameState.territories[t];
            mapHtml += `<div class="territory-row"><span><strong>${t}</strong></span><span>Owner: [${data.owner}] | Armies: ${data.armies}</span></div>`;
        });
        mapHtml += `</div>`;
    }
    document.getElementById('map-display').innerHTML = mapHtml;
}

function executeReinforce() {
    let terr = document.getElementById('ref-terr').value;
    let amt = parseInt(document.getElementById('ref-amt').value);

    if(amt > 0 && amt <= gameState.reinforcementsLeft) {
        gameState.territories[terr].armies += amt;
        gameState.reinforcementsLeft -= amt;
        logMessage(`Player [${gameState.players[gameState.currentTurn]}] placed ${amt} armies in ${terr}.`);

        if(gameState.reinforcementsLeft === 0) {
            gameState.phase = 'attack';
            logMessage(`Phase changed to ATTACK.`);
        }
        updateUI();
    }
}

function updateAttackTargets() {
    let fromTerr = document.getElementById('atk-from').value;
    let targetSelect = document.getElementById('atk-to');
    if(!fromTerr || !targetSelect) return;

    let currentPlayer = gameState.players[gameState.currentTurn];
    let neighbors = connections[fromTerr] || [];
    let validEnemies = neighbors.filter(n => gameState.territories[n].owner !== currentPlayer);

    targetSelect.innerHTML = validEnemies.map(n => `<option value="${n}">${n} (Owner: [${gameState.territories[n].owner}], Armies: ${gameState.territories[n].armies})</option>`).join('');
}

function executeAttack() {
    let from = document.getElementById('atk-from').value;
    let to = document.getElementById('atk-to').value;

    if(!from || !to) {
        alert("Please select valid attack paths.");
        return;
    }

    let attackerArmies = gameState.territories[from].armies;
    let defenderArmies = gameState.territories[to].armies;

    if(attackerArmies < 2) {
        alert("You need at least 2 armies in the source territory to attack!");
        return;
    }

    let atkDice = Math.min(3, attackerArmies - 1);
    let defDice = Math.min(2, defenderArmies);

    let atkRolls = [];
    for(let i=0; i<atkDice; i++) atkRolls.push(Math.floor(Math.random() * 6) + 1);
    let defRolls = [];
    for(let i=0; i<defDice; i++) defRolls.push(Math.floor(Math.random() * 6) + 1);

    atkRolls.sort((a,b) => b-a);
    defRolls.sort((a,b) => b-a);

    let atkLoss = 0;
    let defLoss = 0;

    for(let i=0; i<Math.min(atkRolls.length, defRolls.length); i++) {
        if(atkRolls[i] > defRolls[i]) {
            defLoss++;
        } else {
            atkLoss++;
        }
    }

    gameState.territories[from].armies -= atkLoss;
    gameState.territories[to].armies -= defLoss;

    logMessage(`BATTLE: ${from} attacked ${to}. Attacker lost ${atkLoss}, Defender lost ${defLoss}.`);

    if(gameState.territories[to].armies <= 0) {
        let previousOwner = gameState.territories[to].owner;
        let currentPlayer = gameState.players[gameState.currentTurn];
        gameState.territories[to].owner = currentPlayer;
        
        let movingArmies = Math.floor(gameState.territories[from].armies / 2);
        gameState.territories[from].armies -= movingArmies;
        gameState.territories[to].armies = movingArmies;

        logMessage(`CONQUERED! [${currentPlayer}] captured ${to} from [${previousOwner}].`);

        let totalTerritories = Object.keys(gameState.territories).length;
        let playerTerritories = Object.keys(gameState.territories).filter(t => gameState.territories[t].owner === currentPlayer).length;
        if(playerTerritories === totalTerritories) {
            alert(`Player [${currentPlayer}] wins the game!`);
            location.reload();
        }
    }

    updateUI();
}

function endAttackPhase() {
    gameState.phase = 'fortify';
    logMessage(`Phase changed to FORTIFY.`);
    updateUI();
}

function executeFortify() {
    let from = document.getElementById('fort-from').value;
    let to = document.getElementById('fort-to').value;
    let amt = parseInt(document.getElementById('fort-amt').value);

    let currentPlayer = gameState.players[gameState.currentTurn];

    if(from && to && gameState.territories[from].owner === currentPlayer && gameState.territories[to].owner === currentPlayer) {
        if(connections[from] && connections[from].includes(to)) {
            if(gameState.territories[from].armies > amt) {
                gameState.territories[from].armies -= amt;
                gameState.territories[to].armies += amt;
                logMessage(`Fortified ${amt} armies from ${from} to ${to}.`);
            } else {
                alert("Not enough armies to leave behind!");
                return;
            }
        } else {
            alert("Territories are not connected!");
            return;
        }
    }
    endTurn();
}

function endTurn() {
    gameState.currentTurn = (gameState.currentTurn + 1) % gameState.players.length;
    startTurn();
}
</script>
